output_dir = "hrccs_output/bd143065b_eclipse"
show_progress = true

[input]
decanter_dir = "../outputs/decanter_final/bd143065b"

[system]
planet_name = "BD-14 3065 b"
observation_type = "eclipse"
period_days = 4.2889731
event_midpoint_bjd_tdb = 2459315.7361
event_duration_hours = 2.255
expected_kp_kms = 164.6
eccentricity = 0.066
argument_of_periastron_deg = 54.0
ra_deg = 153.66967
dec_deg = -15.64284
stellar_rv_kms = 7.74
stellar_radius_rsun = 2.35
planet_radius_rjup = 1.926
planet_mass_mjup = 12.37
# The isothermal proxy uses the measured dayside brightness temperature.
equilibrium_temperature_k = 3520.0
metallicity_dex = -0.34

[atmosphere]
species = ["H2O", "C", "FeH", "CrH", "Fe"]
include_rayleigh = true
include_cia = true
cache_dir = "~/.cache/decanter/hrccs"

[reduction]
telluric_threshold = 0.90
telluric_mask_scope = "signal"
ccf_lsf_margin_widths = 3.0
svd_components = [3, 4, 5, 6, 7, 8]

[search]
kp_step_kms = 4.0
vsys_step_kms = 2.0
local_kp_half_width_kms = 30.0
local_vsys_half_width_kms = 15.0

[injection]
# The inverted transmission proxy has a very small scale height for this
# massive object. Amplify only the synthetic recovery experiment; the
# observed-data CCF continues to use the nominal line pattern.
scale = 10.0
null_realizations = 5

[plots]
enabled = true
orders_per_page = 5
formats = ["pdf", "png"]
